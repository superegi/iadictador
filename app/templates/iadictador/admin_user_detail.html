<link rel="stylesheet" href="/static/iadictador_sidebar_fix.css">
{% extends "iadictador/base.html" %}
{% block title %}Usuario{% endblock %}
{% block content %}

<div class="panel">
  <div class="top-actions">
    <div style="flex:1;">
      <h3>Usuario: {{ target_user.username }}</h3>
      <p class="muted">Ficha individual de usuario. Aquí se editan datos, rol, estado y cobro.</p>
    </div>
    <a class="button back-button" href="/iad/admin/usuarios">Volver</a>
  </div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/iad/admin/usuarios/{{ target_user.id }}/guardar">
    <div class="grid-3">
      <div>
        <label>Usuario</label>
        <input name="username" value="{{ target_user.username }}" required>
      </div>
      <div>
        <label>Email</label>
        <input name="email" type="email" value="{{ target_user.email or '' }}">
      </div>
      <div>
        <label>Rol</label>
        <select name="role">
          <option value="user" {% if target_user.role == "user" %}selected{% endif %}>user</option>
          <option value="admin" {% if target_user.role == "admin" %}selected{% endif %}>admin</option>
        </select>
      </div>
    </div>

    <br>

    <div class="grid-3">
      <div>
        <label>Nombre</label>
        <input name="first_name" value="{{ target_user.first_name or '' }}">
      </div>
      <div>
        <label>Apellido</label>
        <input name="last_name" value="{{ target_user.last_name or '' }}">
      </div>
      <div>
        <label>Fecha nacimiento</label>
        <input name="birthdate" value="{{ target_user.birthdate or '' }}">
      </div>
    </div>

    <br>

    <div class="grid-3">
      <div>
        <label>País</label>
        <input name="country" value="{{ target_user.country or '' }}">
      </div>
      <div>
        <label>Zona horaria</label>
        <select name="timezone">
<option value="">Sin definir</option>
<option value="America/Santiago" {% if target_user.timezone == "America/Santiago" %}selected{% endif %}>America/Santiago</option>
<option value="America/Argentina/Buenos_Aires" {% if target_user.timezone == "America/Argentina/Buenos_Aires" %}selected{% endif %}>America/Argentina/Buenos_Aires</option>
<option value="America/Lima" {% if target_user.timezone == "America/Lima" %}selected{% endif %}>America/Lima</option>
<option value="America/Bogota" {% if target_user.timezone == "America/Bogota" %}selected{% endif %}>America/Bogota</option>
<option value="America/Mexico_City" {% if target_user.timezone == "America/Mexico_City" %}selected{% endif %}>America/Mexico_City</option>
<option value="America/New_York" {% if target_user.timezone == "America/New_York" %}selected{% endif %}>America/New_York</option>
<option value="Europe/Madrid" {% if target_user.timezone == "Europe/Madrid" %}selected{% endif %}>Europe/Madrid</option>
<option value="UTC" {% if target_user.timezone == "UTC" %}selected{% endif %}>UTC</option>
</select>
      </div>
      <div>
        <label>Especialidad</label>
        <input name="specialty" value="{{ target_user.specialty or '' }}">
      </div>
    </div>

    <br>

    <div class="grid-3">
      <div>
        <label>Subespecialidad</label>
        <input name="subspecialty" value="{{ target_user.subspecialty or '' }}">
      </div>
      <div>
        <label>Activo</label>
        <label><input type="checkbox" name="is_active" {% if target_user.is_active %}checked{% endif %}> Usuario activo</label>
      </div>
      <div>
        <label>Cambio clave obligatorio</label>
        <label><input type="checkbox" name="must_change_password" {% if target_user.must_change_password %}checked{% endif %}> Requerir cambio</label>
      </div>
    </div>

    <br>

    <div class="grid-3">
      <div>
        <label>Cobro visible</label>
        <label><input type="checkbox" name="billing_visible" {% if target_user.billing_visible %}checked{% endif %}> Mostrar cobro</label>
      </div>
      <div>
        <label>Cobro habilitado</label>
        <label><input type="checkbox" name="billing_enabled" {% if target_user.billing_enabled %}checked{% endif %}> Cobrar</label>
      </div>
      <div>
        <label>Valor por transcripción</label>
        <input name="price_per_transcription" value="{{ target_user.price_per_transcription or '' }}">
      </div>
    </div>

    <br>

    <div class="grid-2">
      <div>
        <label>Nueva clave temporal</label>
        <input name="new_password" placeholder="dejar vacío para no cambiar">
      </div>
      <div>
        <label>&nbsp;</label>
        <button type="submit">Guardar usuario</button>
      </div>
    </div>
  </form>
</div>

{% endblock %}

<script src="/static/iadictador_sidebar_fix.js"></script>

<script src="/static/iad_v4_validation_sync.js"></script>
