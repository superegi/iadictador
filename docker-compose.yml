services:
  iadictador:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iadictador_appv3
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${APP_PORT:-8015}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8015}:${APP_PORT:-8015}"
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8015}
      TZ: ${TZ:-America/Santiago}
      IADICTADOR_SESSION_SECRET: ${IADICTADOR_SESSION_SECRET}
      IADICTADOR_ADMIN_USER: ${IADICTADOR_ADMIN_USER}
      IADICTADOR_ADMIN_PASSWORD: ${IADICTADOR_ADMIN_PASSWORD}
      IADICTADOR_DB_URL: ${IADICTADOR_DB_URL}
      IADICTADOR_UPLOAD_DIR: ${IADICTADOR_UPLOAD_DIR}
      IAD_RULES_FILE: ${IAD_RULES_FILE:-/data/reglas_radiologicas.md}
    volumes:
      - iadictador_data:/data
    command: >
      uvicorn app.main:app
      --host ${APP_HOST:-0.0.0.0}
      --port ${APP_PORT:-8015}

volumes:
  iadictador_data:
